# Sessão em memória: o form login do authorization server precisa de HttpSession,
# e em desenvolvimento não há Redis no host. Substitui o antigo
# spring.session.store-type=none, removido no Spring Boot 3.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

# Database
spring.datasource.username=root
spring.datasource.password=toor123
spring.jpa.show-sql=true
# O callback afterMigrate.sql (massa de teste) mora em db/data. Apontava para
# db/testdata, diretório que não existe — o Flyway só procura callbacks dentro
# das locations configuradas, então a carga nunca rodava e o banco subia vazio.
spring.flyway.locations=classpath:db/migration,classpath:db/data

# Storage
algafood.storage.tipo=local
algafood.storage.local.diretorio-fotos=${user.home}/catalogo

# Email
spring.mail.host=fake
algafood.email.remetente=AlgaFood <nao-responda@algafood.local>

# Security
# Keystore de desenvolvimento, gerado com:
#   keytool -genkeypair -alias algafood -keyalg RSA -keysize 2048 \
#     -keystore src/main/resources/algafood.jks -storetype JKS \
#     -storepass 123456 -keypass 123456 -validity 3650
# Em produção o par de chaves vem de fora do jar (variáveis de ambiente).
algafood.jwt.keystore.jks-location=classpath:algafood.jks
algafood.jwt.keystore.password=123456
algafood.jwt.keystore.keypair-alias=algafood
