# =============================================================================
# Perfil de produção.
#
# Todo valor sensível vem de variável de ambiente e, de propósito, sem default,
# para nunca herdar configuração de desenvolvimento.
#
# Atenção ao modo de falha: o Spring não aborta em placeholder não resolvido — ele
# repassa o texto literal "${VAR}". Na maioria dos casos isso derruba o boot logo
# em seguida (o keystore checa isso explicitamente e diz qual variável falta, o
# banco recusa a senha), mas em campos sem validação, como MAIL_REMETENTE, o
# literal passa direto e só aparece em tempo de execução. Confira as variáveis
# antes de subir.
#
# Variáveis exigidas:
#
#   DB_HOST  DB_USERNAME  DB_PASSWORD
#   REDIS_HOST
#   JWT_KEYSTORE_LOCATION  JWT_KEYSTORE_PASSWORD
#   AWS_ACCESS_KEY_ID  AWS_SECRET_ACCESS_KEY  AWS_S3_BUCKET  AWS_S3_REGION
#   MAIL_HOST  MAIL_USERNAME  MAIL_PASSWORD  MAIL_REMETENTE
#
# Opcionais (têm default): REDIS_PORT, JWT_KEYSTORE_KEYPAIR_ALIAS, MAIL_PORT,
# APP_BASE_URL, LOGGLY_TOKEN (este só tem efeito com o perfil "loggly" junto).
# =============================================================================

# --- Banco de dados ----------------------------------------------------------
# A URL é montada em application.properties a partir de DB_HOST.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Explícito por segurança: db/data/afterMigrate.sql é a massa de teste e começa
# apagando TODAS as tabelas. Ele só roda onde a location é declarada (o perfil de
# desenvolvimento faz isso). Nunca acrescente classpath:db/data aqui.
spring.flyway.locations=classpath:db/migration

# --- Sessão distribuída (Redis) ----------------------------------------------
# Com spring-session-data-redis no classpath o store Redis já é o default; basta
# apontar o host. A propriedade spring.session.store-type não existe mais no
# Spring Boot 3.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# --- Proxy reverso -----------------------------------------------------------
# Atrás do nginx, sem isto o Authorization Server deriva issuer, redirect_uri e
# links HAL do host/porta internos do container em vez do endereço público.
server.forward-headers-strategy=framework

# --- Chaves de assinatura do JWT ---------------------------------------------
# Deve ser um keystore externo ao jar — nunca o algafood.jks de desenvolvimento,
# que vai empacotado e cuja chave privada está no repositório. Ex.:
#   JWT_KEYSTORE_LOCATION=file:/etc/algafood/algafood.jks
algafood.jwt.keystore.jks-location=${JWT_KEYSTORE_LOCATION}
algafood.jwt.keystore.password=${JWT_KEYSTORE_PASSWORD}
algafood.jwt.keystore.keypair-alias=${JWT_KEYSTORE_KEYPAIR_ALIAS:algafood}

# A aplicação é o próprio authorization server e expõe o bean JwtDecoder, então
# este URI só é usado se aquele bean deixar de existir. Mesmo assim fica
# parametrizado para não apontar para localhost em produção.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${APP_BASE_URL:http://localhost:8080}/oauth2/jwks

# --- Armazenamento de fotos (S3) ---------------------------------------------
algafood.storage.tipo=s3
algafood.storage.s3.diretorio-fotos=catalogo
algafood.storage.s3.id-chave-acesso=${AWS_ACCESS_KEY_ID}
algafood.storage.s3.chave-acesso-secreta=${AWS_SECRET_ACCESS_KEY}
algafood.storage.s3.bucket=${AWS_S3_BUCKET}
algafood.storage.s3.regiao=${AWS_S3_REGION}

# --- E-mail (SMTP) -----------------------------------------------------------
algafood.email.impl=smtp
algafood.email.remetente=${MAIL_REMETENTE}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Logging -----------------------------------------------------------------
# Consumido pelo appender Loggly em logback-spring.xml, que só é montado quando o
# perfil "loggly" também está ativo (SPRING_PROFILES_ACTIVE=production,loggly).
# Sem esse perfil o envio fica desligado e a propriedade é ignorada.
logging.loggly.token=${LOGGLY_TOKEN:}
