#logging.level.org.springframework=DEBUG
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/algafood?createDatabaseIfNotExist=true&serverTimezone=UTC
# O Hibernate 6 detecta a versão do MySQL pelo JDBC; MySQL8Dialect foi removido.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# O Hibernate 6 mudou o default de gravação de OffsetDateTime; fixado em UTC para
# casar com o serverTimezone=UTC da URL e manter os dados consistentes.
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE_UTC

# O Spring Boot 3 removeu spring.session.store-type: o store agora é escolhido
# pelo que está no classpath. Como spring-session-data-redis é dependência, o
# Redis é sempre auto-configurado — desligar exige excluir a auto-configuração
# (é o que o perfil de desenvolvimento faz).
spring.freemarker.settings.locale=pt_BR


# Habilitar que a aplicação lançe uma exceção na deserialização do objeto
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-ignored-properties=true

spring.mvc.throw-exception-if-no-handler-found=true
# desabilitando resource handler do spring, desabilitando serviço de arquivos estáticos da pasta static
spring.web.resources.add-mappings=false

server.compression.enabled=true
	
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.servlet.multipart.max-file-size=2MB

# O Spring Authorization Server publica o JWK Set em /oauth2/jwks
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/oauth2/jwks

# Swagger UI (springdoc) — antes era /swagger-ui/index.html servido pelo springfox
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.oauth.client-id=algafood-web
springdoc.swagger-ui.use-pkce-with-authorization-code-grant=true

