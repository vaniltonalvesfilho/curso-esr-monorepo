services:
  algafood-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "toor123"
    ports:
      - "3306:3306"
    networks:
      - algafood-network
  algafood-api:
    image: vaniltonalv3sfilho/algafood-api
    command: ["/app/wait-for-it.sh", "algafood-mysql:3306", "-t", "30", "--", "java", "-jar", "api.jar"]
    environment:
      DB_HOST: algafood-mysql
      # Renomeada no Spring Boot 3: spring.redis.* virou spring.data.redis.*
      SPRING_DATA_REDIS_HOST: algafood-redis
      # O perfil development desliga o Spring Session (não há Redis no host ao
      # rodar fora do Docker). Aqui há, e a sessão compartilhada entre as
      # réplicas depende dele, então a exclusão é desfeita.
      SPRING_AUTOCONFIGURE_EXCLUDE: ""
      SPRING_PROFILES_ACTIVE: development
#    ports:
#      - "8080:8080"
    networks:
      - algafood-network
    depends_on:
      - algafood-mysql
#    deploy:
#      replicas: 3
  algafood-proxy:
    build: nginx/
    image: algafood-proxy
    ports:
      - "80:80"
    networks:
      - algafood-network
    depends_on:
      - algafood-api
  algafood-redis:
    image: redis:7.4-alpine
    networks:
      - algafood-network
networks:
  algafood-network:
    driver: bridge
