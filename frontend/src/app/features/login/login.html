<section class="cartao">
  <h1>AlgaFood</h1>

  <form [formGroup]="formulario" (ngSubmit)="entrar()">
    @if (erro(); as mensagem) {
      <div class="erro">{{ mensagem }}</div>
    }

    <label>
      <span>E-mail</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="username"
        autofocus
        placeholder="joao.ger@algafood.com.br"
      />
      @if (formulario.controls.email.touched && formulario.controls.email.invalid) {
        <small class="aviso">Informe um e-mail válido.</small>
      }
    </label>

    <label>
      <span>Senha</span>
      <input type="password" formControlName="senha" autocomplete="current-password" />
      @if (formulario.controls.senha.touched && formulario.controls.senha.invalid) {
        <small class="aviso">Informe a senha.</small>
      }
    </label>

    <button type="submit" class="primario" [disabled]="enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</section>
