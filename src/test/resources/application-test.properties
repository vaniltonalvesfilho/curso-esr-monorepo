spring.datasource.url=jdbc:mysql://localhost:3306/algafood_test?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=toor123

spring.flyway.locations=classpath:db/migration
spring.datasource.hikari.maximum-pool-size=1

# Os ITs não ativam o perfil development, então precisam da própria configuração
# do keystore: sem ela o JwtKeyStoreProperties (@NotNull/@NotBlank) derruba o
# contexto antes de qualquer teste rodar.
algafood.jwt.keystore.jks-location=classpath:algafood.jks
algafood.jwt.keystore.password=123456
algafood.jwt.keystore.keypair-alias=algafood

# EmailProperties.remetente é @NotNull; a implementação default já é FAKE.
algafood.email.remetente=AlgaFood <nao-responda@algafood.local>

# Sem Redis no ambiente de teste.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
